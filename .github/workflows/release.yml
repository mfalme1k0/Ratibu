name: Build and Release Ratibu

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
    - uses: actions/checkout@v4

    - name: Debug Secrets Presence
      run: |
        echo "Checking if secrets are available to the workflow..."
        if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then echo "GOOGLE_SERVICES_JSON is PRESENT"; else echo "GOOGLE_SERVICES_JSON is MISSING"; fi
        if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then echo "RELEASE_KEYSTORE_BASE64 is PRESENT"; else echo "RELEASE_KEYSTORE_BASE64 is MISSING"; fi
        if [ -n "${{ secrets.KEYSTORE_RELEASE_BASE64 }}" ]; then echo "KEYSTORE_RELEASE_BASE64 is PRESENT"; else echo "KEYSTORE_RELEASE_BASE64 is MISSING"; fi
        if [ -n "${{ secrets.RELEASE_STORE_PASSWORD }}" ]; then echo "RELEASE_STORE_PASSWORD is PRESENT"; else echo "RELEASE_STORE_PASSWORD is MISSING"; fi
        if [ -n "${{ secrets.CLOUDINARY_CLOUD_NAME }}" ]; then echo "CLOUDINARY_CLOUD_NAME is PRESENT"; else echo "CLOUDINARY_CLOUD_NAME is MISSING"; fi
        echo "Current Directory: $(pwd)"
        ls -R

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Create google-services.json
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: |
        printf "%s" "$GOOGLE_SERVICES_JSON" > app/google-services.json
        if [ ! -s app/google-services.json ]; then echo "ERROR: File is empty"; exit 1; fi

    - name: Decode Keystore
      env:
        ENCODED_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 || secrets.KEYSTORE_RELEASE_BASE64 }}
      run: |
        if [ -z "$ENCODED_KEYSTORE" ]; then
          echo "ERROR: No keystore secret found."
          exit 1
        fi
        
        echo "Encoded secret length: ${#ENCODED_KEYSTORE} characters"
        
        # Decode using a method that handles potential whitespace/newlines better
        echo "$ENCODED_KEYSTORE" | tr -d '[:space:]' | base64 -d > keystore.jks
        
        echo "Decoded file size: $(wc -c < keystore.jks) bytes"
        
        if [ ! -s keystore.jks ]; then
          echo "ERROR: Decoded keystore is empty."
          exit 1
        fi
        
        # Check if it's a valid ZIP/JKS header (optional but helpful)
        head -c 4 keystore.jks | hexdump -C || echo "Could not read header"

    - name: Verify Keystore Integrity
      env:
        RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      run: |
        echo "Attempting to list keystore content to verify password and alias..."
        if [ -z "$RELEASE_STORE_PASSWORD" ]; then
          echo "ERROR: RELEASE_STORE_PASSWORD is empty"
          exit 1
        fi
        # This will list the aliases in the keystore. It will fail if the password is wrong.
        keytool -list -keystore keystore.jks -storepass "$RELEASE_STORE_PASSWORD"

    - name: Create local.properties
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}" >> local.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release Bundle (AAB)
      env:
        RELEASE_STORE_FILE: ../keystore.jks
        RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      run: ./gradlew bundleRelease

    - name: Build Release APK
      env:
        RELEASE_STORE_FILE: ../keystore.jks
        RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      run: ./gradlew assembleRelease

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Release v1.0.${{ github.run_number }}
        files: |
          app/build/outputs/bundle/release/app-release.aab
          app/build/outputs/apk/release/app-release.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
